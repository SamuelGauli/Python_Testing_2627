<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club points | GUDLFT</title>
</head>
<body>
    <h1>Club points</h1>
    <p>Read-only standings for every club. No login required.</p>
    <table>
        <thead>
            <tr>
                <th>Club</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody>
        {% for club in clubs %}
            <tr>
                <td>{{ club['name'] }}</td>
                <td>{{ club['points'] }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    <p><a href="{{ url_for('index') }}">Back to the login page</a></p>
</body>
</html>
